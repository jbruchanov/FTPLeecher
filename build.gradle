plugins {
    id 'java'
}

group = 'com.scurab'
version = '1.0-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

dependencies {
    implementation 'commons-io:commons-io:2.22.0'
    implementation 'commons-net:commons-net:3.13.0'

    testImplementation 'junit:junit:4.13.2'
}
